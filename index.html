<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HY-SRF05 - ESP32</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

body {

    font-family: Arial, sans-serif;

    text-align: center;

    background: #f2f2f2;

    padding-top: 50px;

}

h1 {

    font-size: 35px;

}

#estado {

    font-size: 20px;

    margin: 20px;

}

#distancia {

    font-size: 80px;

    font-weight: bold;

    margin: 40px;

}

#unidad {

    font-size: 30px;

}

#ultimo {

    font-size: 18px;

}

</style>

</head>


<body>


<h1>Sensor HY-SRF05</h1>


<div id="estado">

🟡 Conectando MQTT...

</div>


<div id="distancia">

--

<span id="unidad">cm</span>

</div>


<div id="ultimo">

Esperando datos del ESP32...

</div>


<script>


// ======================================
// CONFIGURACIÓN MQTT
// ======================================

const MQTT_HOST =
"TU_SERVIDOR_HIVEMQ";


const MQTT_PORT = 8884;


const MQTT_USER =
"TU_USUARIO";


const MQTT_PASSWORD =
"TU_CONTRASEÑA";


const MQTT_TOPIC =
"esp32/hysrf05/distancia";


// ======================================
// CONEXIÓN MQTT
// ======================================

const cliente = mqtt.connect(

    "wss://" +
    MQTT_HOST +
    ":" +
    MQTT_PORT +
    "/mqtt",

    {

        username: MQTT_USER,

        password: MQTT_PASSWORD,

        clean: true,

        reconnectPeriod: 3000,

        connectTimeout: 10000

    }

);


// ======================================
// CONECTADO
// ======================================

cliente.on("connect", function() {

    console.log("MQTT conectado");

    document.getElementById("estado").innerHTML =
        "🟢 MQTT conectado";


    cliente.subscribe(
        MQTT_TOPIC,
        function(error) {

            if (error) {

                console.log(
                    "Error suscripción:",
                    error
                );

            } else {

                console.log(
                    "Suscrito a:",
                    MQTT_TOPIC
                );

            }

        }
    );

});


// ======================================
// RECIBIR MENSAJES
// ======================================

cliente.on(
    "message",
    function(topic, mensaje) {

        try {

            const datos =
                JSON.parse(
                    mensaje.toString()
                );


            console.log(
                "Datos recibidos:",
                datos
            );


            if (
                typeof datos.distancia_cm
                === "number"
            ) {

                document.getElementById(
                    "distancia"
                ).innerHTML =

                    datos.distancia_cm.toFixed(2) +

                    '<span id="unidad"> cm</span>';


                document.getElementById(
                    "ultimo"
                ).innerHTML =

                    "Sensor: " +
                    datos.sensor +
                    "<br>" +

                    "Topic MQTT: " +
                    topic;

            }

        }

        catch(error) {

            console.log(
                "Mensaje inválido:",
                error
            );

        }

    }
);


// ======================================
// ERROR
// ======================================

cliente.on("error", function(error) {

    console.log(
        "Error MQTT:",
        error
    );

    document.getElementById(
        "estado"
    ).innerHTML =
        "🔴 Error MQTT";

});


// ======================================
// DESCONECTADO
// ======================================

cliente.on("offline", function() {

    document.getElementById(
        "estado"
    ).innerHTML =
        "🟠 MQTT desconectado";

});


// ======================================
// RECONEXIÓN
// ======================================

cliente.on("reconnect", function() {

    document.getElementById(
        "estado"
    ).innerHTML =
        "🟡 Reconectando MQTT...";

});


</script>


</body>

</html>
