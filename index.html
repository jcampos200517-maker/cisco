```
<div class="contenedor">

    <h1>Monitor ESP32</h1>

    <div class="subtitulo">
        Sensor ultrasónico HY-SRF05
    </div>

    <div id="estado" class="estado desconectado">
        MQTT DESCONectado
    </div>

    <div class="sensor">

        <h2>Distancia detectada</h2>

        <div class="distancia">
            <span id="valor">--</span>
            <span class="unidad">cm</span>
        </div>

    </div>

    <div class="informacion">

        <p>
            <strong>Broker:</strong>
            broker.hivemq.com
        </p>

        <p>
            <strong>WebSocket:</strong>
            puerto 8000
        </p>

        <p>
            <strong>Topic:</strong>
            col/cisco/dato
        </p>

        <p>
            <strong>Último mensaje:</strong>
            <span id="ultimoMensaje">Ninguno</span>
        </p>

    </div>

    <div class="mensaje" id="mensaje">
        Esperando conexión con MQTT...
    </div>

</div>


<script>

    // ==========================================
    // CONFIGURACIÓN MQTT
    // ==========================================

    const broker = "wss://broker.hivemq.com:8884/mqtt";

    const topic = "col/cisco/dato";

    // ID aleatorio para evitar conflictos
    const clientId =
        "github_web_" +
        Math.random().toString(16).substring(2, 10);


    // ==========================================
    // ELEMENTOS DE LA PÁGINA
    // ==========================================

    const estado =
        document.getElementById("estado");

    const valor =
        document.getElementById("valor");

    const ultimoMensaje =
        document.getElementById("ultimoMensaje");

    const mensaje =
        document.getElementById("mensaje");


    // ==========================================
    // CONECTAR CON MQTT
    // ==========================================

    mensaje.innerText =
        "Conectando con HiveMQ...";

    const client = mqtt.connect(
        broker,
        {
            clientId: clientId,
            clean: true,
            connectTimeout: 10000,
            reconnectPeriod: 5000
        }
    );


    // ==========================================
    // CUANDO SE CONECTA
    // ==========================================

    client.on("connect", function () {

        console.log("Conectado a HiveMQ");

        estado.innerText =
            "MQTT CONECTADO";

        estado.classList.remove(
            "desconectado"
        );

        estado.classList.add(
            "conectado"
        );

        mensaje.innerText =
            "Conectado. Esperando datos del ESP32...";


        // Suscribirse al topic

        client.subscribe(
            topic,
            function (error) {

                if (error) {

                    console.error(
                        "Error al suscribirse:",
                        error
                    );

                    mensaje.innerText =
                        "Error al suscribirse al topic.";

                } else {

                    console.log(
                        "Suscrito a:",
                        topic
                    );

                    mensaje.innerText =
                        "Esperando datos del HY-SRF05...";
                }
            }
        );

    });


    // ==========================================
    // RECIBIR MENSAJES
    // ==========================================

    client.on("message", function (
        topicRecibido,
        message
    ) {

        // Convertir mensaje MQTT a texto

        const texto =
            message.toString();

        console.log(
            "Mensaje recibido:",
            texto
        );


        // Mostrar mensaje original

        ultimoMensaje.innerText =
            texto;


        // ======================================
        // EXTRAER LA DISTANCIA
        // ======================================

        /*
            El ESP32 envía:

            Distancia: 25.43 cm

            Extraemos solamente:

            25.43
        */

        const resultado =
            texto.match(
                /[-+]?[0-9]*\.?[0-9]+/
            );


        if (resultado) {

            const distancia =
                parseFloat(resultado[0]);


            // Mostrar distancia

            valor.innerText =
                distancia.toFixed(2);


            mensaje.innerText =
                "Dato recibido correctamente desde el ESP32.";

        }

    });


    // ==========================================
    // DESCONEXIÓN
    // ==========================================

    client.on("close", function () {

        console.log(
            "Desconectado de MQTT"
        );

        estado.innerText =
            "MQTT DESconectado";

        estado.classList.remove(
            "conectado"
        );

        estado.classList.add(
            "desconectado"
        );

        mensaje.innerText =
            "Conexión perdida. Intentando reconectar...";

    });


    // ==========================================
    // ERROR
    // ==========================================

    client.on("error", function (error) {

        console.error(
            "Error MQTT:",
            error
        );

        mensaje.innerText =
            "Error de conexión con MQTT.";

    });

</script>
