<!-- AGREGA ESTO DENTRO DE <head> -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
/* =========================================================
   CONFIGURACIÓN DEL CORREO
   ========================================================= */

const EMAILJS_PUBLIC_KEY = "PON_AQUI_TU_PUBLIC_KEY";
const EMAILJS_SERVICE_ID = "PON_AQUI_TU_SERVICE_ID";
const EMAILJS_TEMPLATE_ID = "PON_AQUI_TU_TEMPLATE_ID";

/* 10 metros = 1000 centímetros */
const UMBRAL_ALERTA_CM = 1000;

/* Evita enviar correos cada 2 segundos */
let alertaActiva = false;

/* Inicializar EmailJS */
emailjs.init({
    publicKey: EMAILJS_PUBLIC_KEY
});


/* =========================================================
   FUNCIÓN PARA ENVIAR EL CORREO
   ========================================================= */

function enviarAlertaCorreo(distancia) {

    /* Verificar que los datos de EmailJS estén configurados */
    if (
        EMAILJS_PUBLIC_KEY === "PON_AQUI_TU_PUBLIC_KEY" ||
        EMAILJS_SERVICE_ID === "PON_AQUI_TU_SERVICE_ID" ||
        EMAILJS_TEMPLATE_ID === "PON_AQUI_TU_TEMPLATE_ID"
    ) {

        console.log("EmailJS todavía no está configurado.");
        return;
    }

    const ahora = new Date();

    const parametros = {

        distancia: distancia.toFixed(2),

        distancia_metros: (distancia / 100).toFixed(2),

        hora: ahora.toLocaleString("es-CO"),

        mensaje: "ALERTA: el objeto está a 10 metros o menos.",

        topic: topic
    };


    emailjs.send(
        EMAILJS_SERVICE_ID,
        EMAILJS_TEMPLATE_ID,
        parametros
    )

    .then(function(response) {

        console.log(
            "Correo enviado correctamente:",
            response.status,
            response.text
        );

        const alerta = document.getElementById("alertaCorreo");

        if (alerta) {

            alerta.innerHTML =
                "📧 Correo de alerta enviado correctamente.";

            alerta.style.color = "#22c55e";
        }

    })

    .catch(function(error) {

        console.error(
            "Error enviando el correo:",
            error
        );

        const alerta = document.getElementById("alertaCorreo");

        if (alerta) {

            alerta.innerHTML =
                "❌ Error al enviar el correo.";

            alerta.style.color = "#ef4444";
        }

    });
}


/* =========================================================
   COMPROBAR LA DISTANCIA
   ========================================================= */

function comprobarAlerta(distancia) {

    const alerta = document.getElementById("alertaCorreo");


    /*
       Si la distancia es menor o igual a 10 metros
       10 metros = 1000 centímetros
    */

    if (distancia <= UMBRAL_ALERTA_CM) {

        if (alerta) {

            alerta.innerHTML =
                "🚨 ALERTA: distancia de 10 m o menos.";

            alerta.style.color = "#ef4444";
        }


        /*
           Solo manda UN correo cuando entra
           por primera vez en la zona de alerta.
        */

        if (!alertaActiva) {

            alertaActiva = true;

            enviarAlertaCorreo(distancia);
        }

    }

    else {

        /*
           Cuando vuelve a estar por encima
           de 10 metros, se reinicia la alerta.
        */

        alertaActiva = false;

        if (alerta) {

            alerta.innerHTML =
                "🟢 Distancia superior a 10 m.";

            alerta.style.color = "#22c55e";
        }
    }
}
</script>
